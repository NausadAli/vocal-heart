<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB_01 - all-jobs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Ensures footer sticks to the bottom */
      body {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
      }
      main {
          flex: 1; /* Makes main take up all available space */
      }
  </style>
</head>
<body class="bg-gray-100">
   <nav class="bg-blue-600 p-4 shadow-md">
      <div class="container mx-auto flex justify-between items-center">
          <a href="#" class="text-white text-2xl font-bold">Job Portal</a>
          <ul class="flex space-x-4">
              <li><a href="./index.html" class="text-white hover:text-gray-200 transition">Home</a></li>
              <li><a href="./alljobs.html" class="text-white hover:text-gray-200 transition">Jobs</a></li>
              <li><a href="#" class="text-white hover:text-gray-200 transition">Blog</a></li>
              <li><a href="#" class="text-white hover:text-gray-200 transition">Employers</a></li>
              <li><a href="#" class="text-white hover:text-gray-200 transition">Contact</a></li>
              <li><a href="./login.html" class="bg-blue-500 text-white px-6 py-3 rounded-full font-semibold hover:bg-yellow-400 transition transform hover:scale-105">Join Now</a></li>
          </ul>
      </div>
  </nav>

    <main class="container mx-auto py-8">
        <h1 class="text-3xl font-bold mb-6 text-center">All Available Jobs</h1>
        <div id="jobsContainer" class="mx-20 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 JOB_01. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Function to fetch and display jobs
        async function fetchJobs() {
            try {
                const response = await fetch('http://localhost:3000/api/jobs');
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobs = await response.json();
                const jobsContainer = document.getElementById('jobsContainer');
                jobsContainer.innerHTML = ''; // Clear any existing content

                // Display each job
                jobs.forEach(job => {
                    const jobCard = document.createElement('div');
                    jobCard.classList.add('bg-white', 'p-4', 'rounded-lg', 'shadow-md','transition', 'transform', 'hover:scale-105');

                    jobCard.innerHTML = `
                        <h2 class="text-xl font-bold mb-2">${job.title}</h2>
                        <p class="text-gray-700 font-semibold">Company: ${job.company}</p>
                        <p class="text-gray-600">Location: ${job.location}</p>
                        <p class="text-gray-700 mt-2">${job.description}</p>
                    `;

                    jobsContainer.appendChild(jobCard);
                });
            } catch (error) {
                console.error('Error fetching jobs:', error);
                alert('An error occurred while fetching jobs.');
            }
        }

        // Fetch jobs on page load
        fetchJobs();
    </script>
</body>
</html>
