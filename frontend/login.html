<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOB_01 - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <!-- Navigation Bar -->
  <nav class="bg-blue-600 p-4 shadow-md">
   <div class="container mx-auto flex justify-between items-center">
       <a href="#" class="text-white text-2xl font-bold">Job Portal</a>
       <ul class="flex space-x-4">
           <li><a href="./index.html" class="text-white hover:text-gray-200 transition">Home</a></li>
           <li><a href="./alljobs.html" class="text-white hover:text-gray-200 transition">Jobs</a></li>
           <li><a href="#" class="text-white hover:text-gray-200 transition">Blog</a></li>
           <li><a href="#" class="text-white hover:text-gray-200 transition">Employers</a></li>
           <li><a href="#" class="text-white hover:text-gray-200 transition">Contact</a></li>
           <li><a href="./login.html" class="bg-blue-500 text-white px-6 py-3 rounded-full font-semibold hover:bg-yellow-400 transition transform hover:scale-105">Join Now</a></li>
       </ul>
   </div>
</nav>

  <!-- Login Section -->
  <div class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center">Login to Your Account</h2>
      <form action="#">
        <div class="mb-4">
          <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div class="mb-6">
          <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition"
        >
          Login
        </button>
      </form>
      <p class="text-center text-gray-600 mt-4">
        Don't have an account? <a href="#" class="text-blue-600 hover:underline">Sign Up</a>
      </p>
    </div>
  </div>
</body>
</html>
